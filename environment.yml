name: minute-agent
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - polars
  - pyarrow
  - lightgbm
  - pyyaml
  - pytest
  - pip
  # GPU stack from conda-forge, not pip: pip's torch bundles Intel's libiomp5md.dll,
  # which clashes with the LLVM OpenMP used by conda-forge numpy (MKL) and LightGBM
  # and aborts the process ("OMP: Error #15"). Driver 610.x runs CUDA 13 builds.
  - pytorch=2.14.1=cuda134*
  - xgboost=3.4.2=cuda13*
