# Trading costs for the backtest engine. Set by hand; the agent cannot change them.
# Every run records the cost config it used (and its hash) in the ledger.
name: default
commission_rate: 0.00025        # per side, fraction of traded value
min_commission: 5.0             # CNY per order (applied per stock per trade)
transfer_fee_rate: 0.00001      # 过户费, both sides
stamp_duty_sell:                # sell side only, switched by date
  - {until: "2023-08-27", rate: 0.001}
  - {from: "2023-08-28", rate: 0.0005}
slippage_bps: 3.0               # per side, fixed floor in basis points
impact_coef: 0.0                # square-root impact Y in  Y * sigma_bar * sqrt(q / V_bar); 0 = off
participation_cap: 0.10         # max share of the execution bars' volume we may trade
cost_multiplier: 1.0            # scale all costs (use 2.0 for the stress test)
